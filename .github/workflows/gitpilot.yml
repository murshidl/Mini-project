# managed-by: gitpilot
# Generated by GitPilot. Review before committing. Hand edits are detected: gitpilot pipeline validate, then resync or eject.
name: GitPilot CI/CD

on:
  push:
    branches:
      - 'main'
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # weekly re-scan for newly published CVEs
  workflow_dispatch:
    inputs:
      target:
        description: Deploy environment (none = CI and scans only)
        required: true
        type: choice
        options: [none, staging, production]
        default: none

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets (gitleaks, full Git history)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' 'zricethezav/gitleaks:v8.30.1' git /src --redact --no-banner --exit-code 1
      - name: Source code (Semgrep SAST)
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src 'semgrep/semgrep:1.185.0' semgrep scan --metrics=off --error --config 'p/default' --severity ERROR .
      - name: Dependencies (Trivy, known CVEs)
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src 'aquasec/trivy:0.69.3' fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
      - name: Dockerfile and IaC (Trivy misconfiguration)
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src 'aquasec/trivy:0.69.3' fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .
